[project]
name = "workshop-spatial-ai"
version = "0.1.0"
description = "Cervical triads & TLS — spatial-AI workshop (2026-06-10)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # data + analysis
    "scanpy>=1.10",
    "anndata>=0.10",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "scipy>=1.11",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "h5py>=3.10",
    # rendering
    "pillow>=10",
    "matplotlib>=3.8",
    # notebook
    "jupyterlab>=4.0",
    "nbconvert>=7.10",
    "ipykernel>=6.29",
]

[tool.uv]
# keep the workshop env reproducible; lock is committed
